openapi: 3.0.4
info:
  title: Travel Entry Requirements
  description: >-
    Travel Entry Requirements returns what a destination asks of a visitor's
    passport and health documents: how long the passport must stay valid and
    from when, and whether a yellow fever certificate is required. Paid plans
    add a passport check against your trip dates, the blank pages it needs, the
    Schengen 10-year issue rule, the current UK and US travel advisory levels
    and plain-English guidance for each rule.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/entryrequirements:
    get:
      summary: Travel Entry Requirements
      description: >-
        Get passport validity, blank pages, yellow fever and travel advisory
        levels for one destination
      operationId: entryrequirements
      parameters:
        - name: destination
          in: query
          schema:
            type: string
          required: true
          description: >-
            The destination country or territory: a two-letter ISO code such as
            TH, or an English name such as Thailand
          example: TH
        - name: arrivalDate
          in: query
          schema:
            type: string
          required: false
          description: Trip arrival date (YYYY-MM-DD), for passportCheck
          example: '2027-03-01'
        - name: departureDate
          in: query
          schema:
            type: string
          required: false
          description: Trip departure date (YYYY-MM-DD), for passportCheck
          example: '2027-03-15'
        - name: passportExpiry
          in: query
          schema:
            type: string
          required: false
          description: >-
            The traveler's passport expiry date (YYYY-MM-DD); passportCheck says
            whether it meets the destination's rule
          example: '2027-07-01'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  destination: TH
                  destinationName: Thailand
                  passportValidity:
                    rule: months_after_arrival
                    months: 6
                    days: null
                    summary: Valid for at least 6 months after arrival
                    issuedWithinYears: null
                    guidance: >-
                      Your passport must be valid for at least 6 months after
                      the day you arrive. It needs at least 1 blank page.
                  blankPagesRequired: 1
                  passportCheck: null
                  yellowFever:
                    certificate: from_risk_countries
                    certificateLabel: >-
                      Certificate required only when arriving from, or
                      transiting, a country with yellow fever risk
                    guidance: >-
                      A yellow fever vaccination certificate is required only if
                      you are arriving from, or have transited through, a
                      country with a risk of yellow fever transmission.
                      Travelers coming directly from elsewhere do not need one.
                  advisories:
                    uk:
                      level: avoid_all_but_essential_travel_to_parts
                      label: >-
                        Advises against all but essential travel to parts of the
                        country
                      url: https://www.gov.uk/foreign-travel-advice/thailand
                    us:
                      level: 1
                      label: Exercise normal precautions
                      url: https://travel.state.gov/content/tsg_aem/us/en/home/international-travel/travel-advisories/destination.tha.html
                  rulesUpdatedAt: '2026-10-12T10:20:34+01:00'
                  updatedAt: '2026-11-14T08:32:16.103Z'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
